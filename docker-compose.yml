services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://glassbase:secret@db:5432/glassbase?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APP_ENV: production
      POOL_TUNED: "true"
      MAX_CONCURRENT: "8"
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glassbase
      POSTGRES_USER: glassbase
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glassbase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
